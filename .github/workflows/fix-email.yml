name: Fix Commit History
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite History
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git filter-branch -f --env-filter '
          if [ "$GIT_AUTHOR_EMAIL" = "niloysharma2005@gamil.com" ]; then
              export GIT_AUTHOR_EMAIL="niloysharma2005@gmail.com"
          fi
          if [ "$GIT_COMMITTER_EMAIL" = "niloysharma2005@gamil.com" ]; then
              export GIT_COMMITTER_EMAIL="niloysharma2005@gmail.com"
          fi
          ' --tag-name-filter cat -- --branches --tags
          git push --force origin main
          
